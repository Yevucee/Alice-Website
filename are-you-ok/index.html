<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Are you ok? | Alice the Time Bender</title>
<meta name="description" content="Are you ok? — Alice.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#EDEBE7;
    --ink:#1A1A18;
    --img-hero:url('https://picsum.photos/id/1018/1800/1100?grayscale');
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bone);color:#f4f0e8;font-family:'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased}
  .display{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.04;letter-spacing:-.01em}
  .hero{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;z-index:0;
      background:
        linear-gradient(90deg,rgba(8,7,6,.58) 0%,rgba(8,7,6,.22) 55%,rgba(20,14,6,.10) 100%),
        linear-gradient(160deg,rgba(150,128,90,.28),rgba(40,32,18,.38)),
        var(--img-hero) center/cover no-repeat;
      background-blend-mode:normal,multiply,normal;
      filter:sepia(.20) contrast(1.01) brightness(1.18)}
  main{
    position:relative;z-index:2;width:100%;text-align:center;
    padding:
      clamp(24px,6vw,48px)
      max(clamp(16px,5vw,40px), env(safe-area-inset-right, 0px))
      max(clamp(24px,6vw,48px), env(safe-area-inset-bottom, 0px))
      max(clamp(16px,5vw,40px), env(safe-area-inset-left, 0px));
  }
  blockquote{border:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.5vh,32px)}
  h1{
    font-size:clamp(1.5rem,4.8vw + 0.85rem,6rem);
    font-weight:500;
    line-height:1.05;
    color:#f4f0e8;
    margin:0;
    max-width:100%;
    white-space:nowrap;
    text-shadow:0 2px 28px rgba(8,7,6,.45);
  }
  .byline{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(1.125rem,2.4vw + 0.65rem,2rem);
    letter-spacing:.14em;
    color:#e6dfd1;
    font-style:italic;
    margin:0;
    text-shadow:0 1px 18px rgba(8,7,6,.4);
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <main>
    <blockquote cite="#">
      <h1 class="display">Are you ok?</h1>
      <p class="byline">Alice.</p>
    </blockquote>
  </main>
</header>

</body>
</html>
